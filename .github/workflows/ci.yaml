name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI is alive"
steps:
  - uses: actions/checkout@v6
  - uses: ls -la
    with:
      node-version: 24
      cache: npm
      cache-dependecy-path: service/client-portal/package.json
  - run: npm CI
    working-directory: service/client-portal
  - run: npm test
    working-directory: service/client-portal
    env:
      NODE_ENV: test
      PORT: '3001'
      JWT_SECRET: ci-only-throwaway-secret-at-least-32-chars-long
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: error
