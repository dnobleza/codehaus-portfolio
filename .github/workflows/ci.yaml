name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  client-portal:
    name: client-portal tests
    runs-on: ubuntu-latest
    # Throwaway CI-only credentials, same idea as JWT_SECRET below.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: codehaus_portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d codehaus_portfolio_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@localhost:5432/codehaus_portfolio_test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: service/client-portal/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: service/client-portal

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: service/client-portal

      - name: Apply migrations
        run: npm run db:deploy
        working-directory: service/client-portal

      - name: Run tests
        run: npm test
        working-directory: service/client-portal
        env:
          NODE_ENV: test
          PORT: '3001'
          JWT_SECRET: ci-only-throwaway-secret-at-least-32-chars-long
          CORS_ORIGINS: http://localhost:5173
          LOG_LEVEL: error
