# Local infrastructure. PostgreSQL only for now.
services:
  postgres:
    image: postgres:18
    container_name: codehaus-portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: codehaus_portfolio
    ports:
      - '${POSTGRES_PORT:-5434}:5432' # host 5434 -> container 5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d codehaus_portfolio']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
